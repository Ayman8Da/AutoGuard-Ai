services:
  autoguard:
    build:
      context: .
      dockerfile: Dockerfile
    image: autoguard-ai:local
    container_name: autoguard-ai
    ports:
      - "8000:8000"
    environment:
      AUTOGUARD_ENVIRONMENT: local
      AUTOGUARD_LOG_FORMAT: console
      AUTOGUARD_LLM_PROVIDER: mock
      AUTOGUARD_TELEMETRY_BUFFER_SIZE: "1000"
      AUTOGUARD_DIAGNOSTICS_BUFFER_SIZE: "500"
      AUTOGUARD_INCIDENT_BUFFER_SIZE: "500"
      AUTOGUARD_MONITORING_BUFFER_SIZE: "5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
